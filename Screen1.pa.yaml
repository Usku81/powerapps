Screens:
  Screen1:
    Properties:
      Fill: =ColorBg
    Children:
      - ScreenContainer1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - HeaderContainer1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                Children:
                  - LogoImage:
                      Control: Image
                      Properties:
                        Fill: =ColorPrimary
                        Height: =50
                        Image: ='Main on Dark back 3'
                        Width: =120
                  - UserAvatar:
                      Control: Avatar
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorPrimary
                        Height: =36
                        Name: =varCurrentUserName
                        Width: =36
            - MainContainer1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =ColorBg
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                Children:
                  - avatarLarge:
                      Control: Avatar
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColorPrimary
                        Height: =72
                        Name: =varCurrentUserName
                        Width: =72
                  - lblProfileName:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextPrimary
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =24
                        Text: =varCurrentUserName
                  - lblProfileEmail:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextSecondary
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =varCurrentUserEmail
                  - dividerProfile:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Fill: =RGBA(200, 200, 210, 1)
                        FillPortions: =0
                        Height: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width - 32
                  - statsRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =100
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width - 32
                      Children:
                        - statTotal:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =ColorSurface
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblTotalNum:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorPrimary
                                    FontWeight: =FontWeight.Bold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(CountRows(Filter(Requests, RequesterEmail = varCurrentUserEmail)))
                                    Wrap: =false
                              - lblTotalLabel:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Нийт"
                                    Wrap: =false
                        - statPending:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =ColorSurface
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblPendingNum:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorWarning
                                    FontWeight: =FontWeight.Bold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(CountRows(Filter(Requests, RequesterEmail = varCurrentUserEmail && Status.Value = "Pending Manager")))
                                    Wrap: =false
                              - lblPendingLabel:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Хүлээгдэж байна"
                                    Wrap: =false
                        - statApproved:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Fill: =ColorSurface
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblApprovedNum:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorSuccess
                                    FontWeight: =FontWeight.Bold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(CountRows(Filter(Requests, RequesterEmail = varCurrentUserEmail && Status.Value = "Approved")))
                                    Wrap: =false
                              - lblApprovedLabel:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =ColorTextSecondary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Зөвшөөрөгдсөн"
                                    Wrap: =false
                  - dividerRequests:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Fill: =RGBA(200, 200, 210, 1)
                        FillPortions: =0
                        Height: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width - 32
                  - lblSectionHeader:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextSecondary
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Таны хүсэлтүүд"
                        Width: =Parent.Width - 32
                        Wrap: =false
                  - btnNewRequest:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorPrimary
                        Height: =48
                        OnSelect: =Navigate(Screen2)
                        Text: ="＋  Шинэ хүсэлт"
                        Width: =Parent.Width - 32
                  - galRequests:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(Self.AllItems) * 118
                        Items: =Sort(Filter(Requests, RequesterEmail = varCurrentUserEmail), SubmittedOn, SortOrder.Descending)
                        ShowScrollbar: =false
                        TemplatePadding: =4
                        TemplateSize: =110
                        Width: =Parent.Width - 32
                      Children:
                        - cardRequest:
                            Control: ModernCard
                            Properties:
                              Description: =Text(ThisItem.StartDate,"yyyy-mm-dd") & " – " & Text(ThisItem.EndDate,"yyyy-mm-dd")
                              DescriptionColor: =ColorTextSecondary
                              DropShadow: =DropShadow.Semilight
                              Fill: =ColorSurface
                              HeaderImage: =Blank()
                              Image: =Blank()
                              OnSelect: =Set(varSelectedRequest, ThisItem)
                              Subtitle: =ThisItem.Status.Value
                              SubtitleColor: =If(ThisItem.Status.Value = "Pending Manager" || ThisItem.Status.Value = "Pending CEO", ColorWarning, ThisItem.Status.Value = "Approved", ColorSuccess, ColorDanger)
                              SubtitleSize: =13
                              Title: =ThisItem.Title
                              TitleColor: =ColorTextPrimary
                              Width: =Parent.Width
            - FooterContainer1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - tabNav:
                      Control: ModernTabList
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorPrimary
                        Default: |-
                          ={Value: "Нүүр"}
                        FillPortions: =1
                        Items: =If(varIsManager, Table({Value:"Нүүр"},{Value:"Менежер"}), Table({Value:"Нүүр"}))
                        OnChange: |-
                          =If(
                            Self.Selected.Value = "Нүүр", Navigate(Screen1),
                            Navigate(Screen3)
                          )
