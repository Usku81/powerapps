Screens:
  Screen2:
    Properties:
      Fill: =ColorBg
    Children:
      - ScreenContainer2:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =ColorBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - HeaderContainer2:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =ColorSurface
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =8
                  PaddingRight: =16
                  PaddingTop: =12
                Children:
                  - btnBack:
                      Control: Classic/Icon
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =ColorTextPrimary
                        Fill: =RGBA(0,0,0,0)
                        Height: =40
                        Icon: =Icon.ChevronLeft
                        OnSelect: =Navigate(Screen1)
                        Width: =40
                  - lblTitle:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextPrimary
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="Шинэ хүсэлт"
                        Wrap: =false
            - MainContainer2:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =ColorBg
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                Children:
                  - lblTypeLabel:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextSecondary
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Хүсэлтийн төрөл"
                        Wrap: =false
                  - ddRequestType:
                      Control: ModernDropdown
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorPrimary
                        ItemDisplayText: =ThisItem.Title
                        Items: =RequestTypes
                        Width: =Parent.Width - 32
                  - lblStartLabel:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextSecondary
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Эхлэх огноо"
                        Wrap: =false
                  - dpStartDate:
                      Control: ModernDatePicker
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorPrimary
                        Width: =Parent.Width - 32
                  - lblEndLabel:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextSecondary
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Дуусах огноо"
                        Wrap: =false
                  - dpEndDate:
                      Control: ModernDatePicker
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorPrimary
                        Width: =Parent.Width - 32
                  - lblReasonLabel:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =ColorTextSecondary
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Шалтгаан"
                        Wrap: =false
                  - txtReason:
                      Control: ModernTextInput
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorPrimary
                        Height: =120
                        Placeholder: ="Шалтгаанаа бичнэ үү..."
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width - 32
                  - btnSubmit:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorPrimary
                        Height: =48
                        OnSelect: |-
                          =Patch(Requests, Defaults(Requests), {
                            Title: ddRequestType.Selected.Title,
                            Status: {Value: "Pending Manager"},
                            StartDate: dpStartDate.SelectedDate,
                            EndDate: dpEndDate.SelectedDate,
                            Reason: txtReason.Text,
                            SubmittedOn: Today(),
                            RequesterEmail: varCurrentUserEmail,
                            RequesterName: varCurrentUserName,
                            ManagerEmail: IfError(Office365Users.ManagerV2(varCurrentUserEmail).mail, ""),
                            ManagerComments: ""
                          });
                          Navigate(Screen1)
                        Text: ="Илгээх"
                        Width: =Parent.Width - 32
                  - btnCancel:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Transparent
                        Height: =44
                        OnSelect: =Navigate(Screen1)
                        Text: ="Болих"
                        Width: =Parent.Width - 32
